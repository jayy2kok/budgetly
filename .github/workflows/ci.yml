name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend:
        name: Backend — mvn verify
        # Pin to Ubuntu 22.04: flapdoodle's embedded-Mongo package resolver
        # (de.flapdoodle.os 1.9.0) only recognizes Ubuntu up to 25.10, and
        # MongoDB 7.0.9 is only published for ubuntu2204 in its resolver. On
        # ubuntu-latest (26.04) it detects bare "Ubuntu" and fails to resolve
        # the mongod 7.0.9 binary.
        runs-on: ubuntu-22.04
        defaults:
            run:
                working-directory: budgetly_api

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven

            - name: Build & test (embedded Mongo, no Docker)
              # Embedded MongoDB via flapdoodle; the test profile disables the
              # change-stream so the unit/e2e suites run headless.
              run: mvn -B --no-transfer-progress verify

    app:
        name: App — Analyze, Test & Build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.41.2"
                  channel: stable
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Analyze code
              run: flutter analyze

            - name: Run tests
              # Real gate: app tests (incl. SmsParser/InboxReader/SmsProvider)
              # now land (WORK-101/102), so a breaking change must fail CI.
              run: flutter test --no-pub

            - name: Build debug APK (validation)
              run: flutter build apk --debug